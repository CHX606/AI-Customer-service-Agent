name: ai-customer-service

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:?Run infra/deploy/configure.py first}
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - search-data:/usr/share/opensearch/data
    # No host port: OpenSearch is reachable only on the private Docker network.
    networks: [search]
    healthcheck:
      test: ["CMD-SHELL", "curl -k -fsS -u \"admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}\" 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    logging: *logging

  backend:
    image: ai-customer-service-backend:local
    build:
      context: .
      dockerfile: infra/deploy/backend.Dockerfile
    env_file: .env.production
    environment:
      API_KEY: ${API_KEY:?Fill API_KEY in .env.production}
      BASE_URL: ${BASE_URL:?Fill BASE_URL in .env.production}
      MODEL: ${MODEL:?Fill MODEL in .env.production}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Run infra/deploy/configure.py first}
      ADMIN_AUTH_DISABLED: "0"
      APP_TENANT_ID: default
      PUBLIC_CHAT_TENANTS: default
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD}
      OPENSEARCH_VERIFY_CERTS: "0"
      OPENSEARCH_BOOTSTRAP_ON_STARTUP: "1"
      SESSION_DB_PATH: /app/data/sessions.db
      RERANKER_BACKEND: onnx
      RERANKER_MODEL_PATH: /app/data/models/bge-reranker-v2-m3-onnx
      RERANKER_ONNX_FILE: onnx/model_qint8_avx2.onnx
      PRELOAD_RAG_MODELS: "1"
    volumes:
      - app-data:/app/data
    networks: [web, search]
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "infra/deploy/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    init: true
    stop_grace_period: 90s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  web:
    image: ai-customer-service-web:local
    build:
      context: .
      dockerfile: infra/deploy/frontend.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      MANAGEMENT_USER: ${MANAGEMENT_USER:-admin}
      MANAGEMENT_PASSWORD_HASH: ${MANAGEMENT_PASSWORD_HASH:?Run infra/deploy/configure.py first}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
    ports:
      - "${HTTP_BIND:-127.0.0.1:8080}:80"
      - "${HTTPS_BIND:-127.0.0.1:8443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

networks:
  web:
  search:
    internal: true

volumes:
  app-data:
  search-data:
  caddy-data:
  caddy-config:
