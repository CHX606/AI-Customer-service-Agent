# Dedicated virtual host: existing websites and port 80 remain untouched.
map $uri $acs_chat_client {
    default "";
    ~^/api/chat(?:/|$) $binary_remote_addr;
}
map $uri $acs_chat_site {
    default "";
    ~^/api/chat(?:/|$) $server_name;
}
limit_req_zone $acs_chat_client zone=acs_chat_rate:1m rate=6r/m;
limit_conn_zone $acs_chat_client zone=acs_chat_ip:1m;
limit_conn_zone $acs_chat_site zone=acs_chat_total:1m;

# One counter across /manage and all authenticated admin APIs, not per URL or
# claimed username. $uri is normalized; only trusted Cloudflare peers can supply
# a replacement client address (see the server-scoped real-IP include below).
map $uri $acs_admin_route {
    default 0;
    ~^/(?:manage(?:/|$)|api/admin(?:/|$)) 1;
}
map $acs_admin_route $acs_admin_client {
    default "";
    1 $binary_remote_addr;
}
map $acs_admin_route $acs_admin_site {
    default "";
    1 $server_name;
}
limit_req_zone $acs_admin_client zone=acs_admin_rate:1m rate=30r/m;
limit_req_zone $acs_admin_site zone=acs_admin_total_rate:1m rate=120r/m;
lua_shared_dict acs_login_guard 2m;

# Keep the actual peer for verification, but never log credentials/query strings.
log_format acs_with_peer '$remote_addr peer=$realip_remote_addr [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent';
map $uri $acs_api_no_store {
    default "";
    ~^/api/(?!admin(?:/|$)) "no-store";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.chx1008.com;

    include /www/sites/ai-customer-service/security/cloudflare-realip.conf;

    ssl_certificate /www/sites/ai-customer-service/ssl/current/fullchain.pem;
    ssl_certificate_key /www/sites/ai-customer-service/ssl/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ACS_SSL:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Cache-Control $acs_api_no_store always;

    client_max_body_size 25m;
    error_page 497 https://ai.chx1008.com$request_uri;
    access_log /www/sites/ai-customer-service/log/access.log acs_with_peer;
    error_log /www/sites/ai-customer-service/log/error.log warn;

    rewrite_by_lua_file /www/sites/ai-customer-service/security/login_guard.lua;
    header_filter_by_lua_file /www/sites/ai-customer-service/security/login_guard.lua;

    location ~ (^|/)\.(?!well-known/) {
        return 404;
    }

    location / {
        # Empty map keys exempt static assets, health and authenticated admin APIs.
        limit_req zone=acs_chat_rate burst=3 nodelay;
        limit_req zone=acs_admin_rate burst=10 nodelay;
        limit_req zone=acs_admin_total_rate burst=20 nodelay;
        limit_req_status 429;
        limit_conn acs_chat_ip 2;
        limit_conn acs_chat_total 3;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
